# UlixOps stack. Network layout and the runner/API boundary: docs/ARCHITECTURE.md.
# Secrets come from .env locally (names in .env.example) and from Infisical in production.
#
#   docker compose up -d --build                       # hub only
#   docker compose --profile testsite up -d --build    # hub + disposable test WordPress site
name: ulixops

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  web:
    <<: *hardened
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_URL: http://api:4000
      # Behind Cloudflare: cf-connecting-ip (set in docker-compose.prod.yml)
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Always-allowed addresses (break-glass), enforced together with the Admin's allowlist
      ALLOWED_IPS: ${ALLOWED_IPS:-}
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    # The only published hub port. Localhost only; Cloudflare Zero Trust sits in front in production.
    ports: ["127.0.0.1:3000:3000"]
    networks: [edge, app]
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *hardened
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      API_PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      # Restricted role: no schema changes, audit log is insert-only (agent decision A32).
      DATABASE_URL: postgresql://ulixops_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/ulixops
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      PLUGIN_STORE_DIR: /data/plugins
      SNAPSHOT_STORE_DIR: /data/snapshots
      VISUAL_STORE_DIR: /data/visual
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-7}
    # Plugin ZIPs and encrypted snapshots, outside any web root (A63, A68).
    volumes: [plugin-store:/data/plugins, snapshot-store:/data/snapshots, visual-store:/data/visual]
    tmpfs: [/tmp]
    networks: [app, db, queue]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # One-shot, as the database owner: applies migrations, then lets the API's role log in
  # (agent decisions A13, A32). The owner password is used nowhere else.
  migrate:
    <<: *hardened
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node dist/db-roles.js"]
    restart: "no"
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql://ulixops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ulixops
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    tmpfs: [/tmp]
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }

  # The only service that may reach sites. No database access (agent decision A3), no published ports.
  runner:
    <<: *hardened
    build: { context: ., dockerfile: apps/runner/Dockerfile }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-2}
      # Written by vault-setup (docs/DEPLOY.md). Empty until then, so compose still starts the
      # vault for that setup; the runner itself refuses to start without them.
      INFISICAL_URL: http://infisical:8080
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      SNAPSHOT_STORE_DIR: /data/snapshots
      # Only the runner encrypts/decrypts snapshot blobs (agent decision A69).
      SNAPSHOT_ENCRYPTION_KEY: ${SNAPSHOT_ENCRYPTION_KEY:?set SNAPSHOT_ENCRYPTION_KEY in .env}
      # Registry ZIPs, read-only (A63 / A81). The API writes; the runner only reads.
      PLUGIN_STORE_DIR: /data/plugins
      # Site copies handed to the scanner sidecar (A138).
      SCAN_WORK_DIR: /scan-work
      # Playwright sidecar handshake + PNG store (A163).
      VISUAL_WORK_DIR: /visual-work
      VISUAL_STORE_DIR: /data/visual
    volumes:
      [
        snapshot-store:/data/snapshots,
        plugin-store:/data/plugins:ro,
        scan-work:/scan-work,
        visual-work:/visual-work,
        visual-store:/data/visual,
      ]
    tmpfs: [/tmp]
    networks: [queue, egress, vault]
    depends_on:
      redis: { condition: service_healthy }
      infisical: { condition: service_healthy }

  # Malware scanner (A140): ClamAV + YARA webshell rules. Reads site copies the runner leaves in
  # scan-work and writes results back. No database, queue, vault or site access; egress only for
  # ClamAV signature updates.
  scanner:
    <<: *hardened
    build: { context: ., dockerfile: docker/scanner/Dockerfile }
    # clamscan loads the whole ClamAV database (~1-1.5 GB); cap it so a scan can never starve
    # the hub. Out of memory fails that scan only (A140).
    mem_limit: 2g
    # ClamAV signatures (~300 MB) persist in scanner-cache between restarts.
    volumes: [scan-work:/work, scanner-cache:/home/scanner]
    tmpfs: [/tmp]
    networks: [egress]

  # Visual checks (A163): Playwright Chromium. Takes screenshots of public pages the runner
  # lists in visual-work; writes PNGs to visual-store. No vault, DB, Redis or SSH.
  visual:
    <<: *hardened
    build: { context: ., dockerfile: docker/visual/Dockerfile }
    mem_limit: 1536m
    shm_size: 256m
    volumes: [visual-work:/work, visual-store:/data/visual]
    tmpfs:
      - /tmp
      - /home/pwuser:uid=1000,gid=1000
    networks: [egress]

  postgres:
    image: postgres:17-alpine
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ulixops
      POSTGRES_DB: ulixops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulixops -d ulixops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # Must start with redis-server so the image drops root and runs as the redis user.
    # BullMQ requires noeviction so queued jobs are never dropped.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes: [redisdata:/data]
    networks: [queue]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Self-hosted secrets vault (agent decision A46) ---------------------------------------
  # Holds the SSH keys for every managed site. Only the runner talks to it. Admins open its UI
  # on 127.0.0.1:8081 (locally, or through an SSH tunnel to the VPS); it is never public.
  infisical:
    image: infisical/infisical:v0.166.8
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?set INFISICAL_ENCRYPTION_KEY in .env}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?set INFISICAL_AUTH_SECRET in .env}
      DB_CONNECTION_URI: postgres://infisical:${INFISICAL_DB_PASSWORD:?set INFISICAL_DB_PASSWORD in .env}@infisical-db:5432/infisical
      REDIS_URL: redis://:${INFISICAL_REDIS_PASSWORD:?set INFISICAL_REDIS_PASSWORD in .env}@infisical-redis:6379
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8081}
      TELEMETRY_ENABLED: "false"
      OTEL_TELEMETRY_COLLECTION_ENABLED: "false"
    ports: ["127.0.0.1:8081:8080"]
    networks: [vault, vault-data, vault-ui]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      infisical-db: { condition: service_healthy }
      infisical-redis: { condition: service_healthy }

  infisical-db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: infisical
      POSTGRES_DB: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:?set INFISICAL_DB_PASSWORD in .env}
    volumes: [infisical-pgdata:/var/lib/postgresql/data]
    networks: [vault-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 5s
      timeout: 3s
      retries: 10

  infisical-redis:
    image: redis:8-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      REDIS_PASSWORD: ${INFISICAL_REDIS_PASSWORD:?set INFISICAL_REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --requirepass
      - ${INFISICAL_REDIS_PASSWORD:?set INFISICAL_REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
    volumes: [infisical-redisdata:/data]
    networks: [vault-data]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Disposable test WordPress site (profile "testsite"); never started on the production VPS ---
  test-wp-db:
    profiles: [testsite]
    image: mariadb:11.4
    security_opt: ["no-new-privileges:true"]
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${TEST_WP_DB_PASSWORD:?set TEST_WP_DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [testwp-db:/var/lib/mysql]
    networks: [testsite]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-wp:
    profiles: [testsite]
    build: docker/test-wp
    security_opt: ["no-new-privileges:true"]
    environment:
      WORDPRESS_DB_HOST: test-wp-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${TEST_WP_DB_PASSWORD:?set TEST_WP_DB_PASSWORD in .env}
      TEST_WP_URL: http://localhost:8080
    volumes:
      - testwp-html:/var/www/html
      # Public key only, created by scripts/dev-ssh-key.sh
      - ./.dev/test-wp:/run/ulixops:ro
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:2222:22"
    networks: [egress, testsite]
    depends_on:
      test-wp-db: { condition: service_healthy }

  # Second disposable WordPress for staging-first deploy tests (Build Order step 10).
  test-wp-staging-db:
    profiles: [testsite]
    image: mariadb:11.4
    security_opt: ["no-new-privileges:true"]
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${TEST_WP_DB_PASSWORD:?set TEST_WP_DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [testwp-staging-db:/var/lib/mysql]
    networks: [testsite]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-wp-staging:
    profiles: [testsite]
    build: docker/test-wp
    security_opt: ["no-new-privileges:true"]
    environment:
      WORDPRESS_DB_HOST: test-wp-staging-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${TEST_WP_DB_PASSWORD:?set TEST_WP_DB_PASSWORD in .env}
      TEST_WP_URL: http://localhost:8082
    volumes:
      - testwp-staging-html:/var/www/html
      - ./.dev/test-wp:/run/ulixops:ro
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:2223:22"
    networks: [egress, testsite]
    depends_on:
      test-wp-staging-db: { condition: service_healthy }

networks:
  edge: {}
  # Runner <-> vault only.
  vault: { internal: true }
  vault-data: { internal: true }
  # Lets the vault UI be published on 127.0.0.1.
  vault-ui: {}
  app: { internal: true }
  db: { internal: true }
  queue: { internal: true }
  egress: {}
  testsite: { internal: true }

volumes:
  pgdata: {}
  plugin-store: {}
  snapshot-store: {}
  scan-work: {}
  scanner-cache: {}
  visual-work: {}
  visual-store: {}
  redisdata: {}
  testwp-db: {}
  testwp-html: {}
  testwp-staging-db: {}
  testwp-staging-html: {}
  infisical-pgdata: {}
  infisical-redisdata: {}
